[project]
name = "shepherd-dev"
version = "0.1.27"
description = "Supervised AI development layer on Shepherd (arXiv 2605.10913): sandboxed Claude workers, deterministic policy + test gate, human-only settlement, coordinated parallel workers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andre Fogelman" }]
dependencies = [
    "shepherd-ai>=0.3.0,<0.4",
]

# Patched build of shepherd-ai: build_tree/insert_tree_entry crashed with
# pygit2.GitError whenever a workspace's own .git (root, or nested from a
# git-sourced dependency) surfaced as a change to snapshot — corrupting
# .vcscore and forcing a manual reset before the next run. Fixed upstream
# at andrefogelman/shepherd-ai@205f668 (fork of shepherd-agents/shepherd,
# not yet reported/merged upstream). Remove this override once upstream
# ships the fix and shepherd-ai's PyPI version picks it up.
#
# Supply-chain note: uv has no pyproject.toml-level hash field for a `url`
# source — the sha256 pin lives in the committed uv.lock, checked on every
# `uv sync`. That pin is only as good as the release asset being immutable,
# so v0.3.1-dotgit-fix's assets on andrefogelman/shepherd-ai must NEVER be
# replaced/re-uploaded. Any future change to this wheel — even a trivial
# one — gets a NEW tag (e.g. v0.3.2-...) and a corresponding uv.lock update,
# never an overwrite of this one.
[tool.uv.sources]
shepherd-ai = { url = "https://github.com/andrefogelman/shepherd-ai/releases/download/v0.3.1-dotgit-fix/shepherd_ai-0.3.1-py3-none-any.whl" }

[project.scripts]
shepherd-dev = "shepherd_dev.cli:entry"

[project.urls]
Repository = "https://github.com/andrefogelman/shepherd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shepherd_dev"]
