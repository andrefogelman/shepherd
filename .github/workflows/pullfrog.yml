# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    # Runner efêmero no mac-ollama (14/10/2026, ordem do dono): VM tart clonada
    # por job e apagada no fim, com `sudo` sem senha dentro dela, que o Pullfrog
    # exige para guardar a credencial da assinatura Grok. Supervisor: anf-runners
    # (GitHub App anf-runners; detalhes no CLAUDE.md do anf-nano).
    runs-on: [self-hosted, pullfrog]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
        # Sem chave de API aqui: o modelo (xai/grok) roda na assinatura Grok,
        # guardada no store cifrado do Pullfrog (`npx pullfrog auth grok`).
