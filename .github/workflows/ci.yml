# The suite only ran on whoever's laptop last touched the code. That is how a
# defect that only reproduces on ONE filesystem reaches main: the stat-based
# diff fast-path (removed in df1edb4) silently dropped a worker's edit wherever
# mtime comes off a coarse clock, and passed on APFS every time.
#
# So the matrix is the point, not decoration. ubuntu gives coarse mtime (one
# jiffy) and GNU coreutils; macos gives nanosecond APFS timestamps and BSD
# userland. The 3.11 floor from pyproject runs alongside a current interpreter,
# because the floor is what catches syntax a newer one would have accepted.
# 3.14 is in the matrix because it is not a superset of 3.13: PEP 649/749
# changed what names the compiler injects (__conditional_annotations__),
# which a static check over symtable sees and 3.13 never emitted.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not hide the other's result
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its dependencies
        run: pip install -e .

      # PYTHONPATH is unset deliberately: the gate scrubs it (see gate_env),
      # and a runner that leaked one would be testing something else.
      - name: Run the suite
        run: env -u PYTHONPATH python -m unittest discover -s tests -v

  # uv.lock once sat 14 versions behind pyproject (0.1.13 vs 0.1.27): the
  # version-bump ritual touched pyproject/__init__/plugin.json and never the
  # lock, so every local `uv run` re-dirtied the tree with the sync. No release
  # doc exists to add the step to — and a doc line nobody reads is not a
  # ritual. A check that fails is.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The lockfile matches pyproject
        run: pip install uv && uv lock --check

  # Timing-sensitive tests pass by luck once. This is the cheap version of the
  # loop that found the flake: the fast, isolated modules, repeated.
  repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Re-run the timing-sensitive modules
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            echo "── round $i ──"
            env -u PYTHONPATH python -m unittest \
              tests.test_diffcollect tests.test_perf tests.test_teepump \
              tests.test_io_perf tests.test_events tests.test_gatestream
          done

  performance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Prepare the performance baseline without creating a branch
        run: |
          git fetch --depth=1 origin 9e6a842bae068c3779a950152aa21d5d64530f81
          mkdir -p "$RUNNER_TEMP/shepherd-baseline"
          git archive 9e6a842bae068c3779a950152aa21d5d64530f81 | tar -x -C "$RUNNER_TEMP/shepherd-baseline"
      - name: Benchmark baseline and current source sequentially
        run: |
          env -u PYTHONPATH python scripts/benchmark_io.py --source-root "$RUNNER_TEMP/shepherd-baseline" --repeat 3 > "$RUNNER_TEMP/baseline.json"
          env -u PYTHONPATH python scripts/benchmark_io.py --source-root "$GITHUB_WORKSPACE" --repeat 3 > "$RUNNER_TEMP/current.json"
          python - "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/current.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          baseline, current = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          lines = ["## I/O performance (Python 3.11)", "",
                   "| Workload | Base (s) | Current (s) | Speedup | Base peak | Current peak |",
                   "| --- | ---: | ---: | ---: | ---: | ---: |"]
          for before, after in zip(baseline["results"], current["results"]):
              assert before["name"] == after["name"]
              lines.append(f'| {after["name"]} | {before["median_s"]:.4f} | {after["median_s"]:.4f} | '
                           f'{before["median_s"] / after["median_s"]:.2f}x | '
                           f'{before["peak_python_bytes"]:,} B | {after["peak_python_bytes"]:,} B |')
          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(report)
          print("BASELINE_JSON=" + json.dumps(baseline))
          print("CURRENT_JSON=" + json.dumps(current))
          PY

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -e . ruff==0.12.10 pyright==1.1.403
      - name: Check source syntax and undefined names
        run: ruff check --select E9,F821,F822,F823 src tests/test_io_perf.py scripts
      - name: Compare type diagnostics against the unchanged baseline
        run: |
          git fetch --depth=1 origin 9e6a842bae068c3779a950152aa21d5d64530f81
          mkdir -p "$RUNNER_TEMP/shepherd-baseline"
          git archive 9e6a842bae068c3779a950152aa21d5d64530f81 | tar -x -C "$RUNNER_TEMP/shepherd-baseline"
          python scripts/check_type_delta.py "$RUNNER_TEMP/shepherd-baseline" "$GITHUB_WORKSPACE"
