# A tag that carries no release is a version nobody can see: the bump lands on
# main, the installer keeps working, and the Releases page stays empty. So the
# tag push is what publishes.
#
# The suite runs first and the publish waits on it. A tool whose whole thesis is
# that a change passes a real test gate before a human is asked to settle it has
# no business shipping a version it never ran.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.11 is the floor in pyproject — testing the floor is what catches
      # syntax that only a newer interpreter would have accepted.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the package and its dependencies
        run: pip install -e .

      - name: Run the suite
        run: python -m unittest discover -s tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Nothing is checked out here — `gh` talks to the API, and the notes are
      # generated server-side from the history behind the tag.
      - name: Publish the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG is already published — leaving it alone"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
          gh release view "$TAG" --json tagName,isDraft,publishedAt
